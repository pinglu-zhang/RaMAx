name: Conda

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build conda package
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: true

      - name: Install build tools
        run: |
          conda install -y -c conda-forge conda-build anaconda-client

      - name: Check tag matches recipe version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          recipe_version="$(sed -n 's/{% set version = "\([^"]*\)" %}/\1/p' recipe/meta.yaml)"
          test -n "${recipe_version}"
          if [ "${tag_version}" != "${recipe_version}" ]; then
            echo "Tag version ${tag_version} does not match recipe version ${recipe_version}" >&2
            exit 1
          fi

      - name: Build conda package
        env:
          RAMAX_CONDA_SOURCE: ${{ startsWith(github.ref, 'refs/tags/') && 'git' || 'path' }}
        run: |
          conda build recipe -c conda-forge --output-folder conda-bld

      - name: List package outputs
        run: |
          find conda-bld -type f \( -name '*.conda' -o -name '*.tar.bz2' \) -print

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ramax-conda-${{ github.sha }}
          if-no-files-found: error
          path: |
            conda-bld/linux-64/ramax-*.conda
            conda-bld/linux-64/ramax-*.tar.bz2

  release:
    name: Upload to Anaconda.org
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: conda-release
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: true

      - name: Install upload client
        run: |
          conda install -y -c conda-forge anaconda-client

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: ramax-conda-${{ github.sha }}
          path: conda-artifacts

      - name: Upload to malab channel
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          test -n "${ANACONDA_API_TOKEN}"
          mapfile -t packages < <(find conda-artifacts -type f \( -name 'ramax-*.conda' -o -name 'ramax-*.tar.bz2' \) -print)
          test "${#packages[@]}" -gt 0
          anaconda -t "${ANACONDA_API_TOKEN}" upload --user malab "${packages[@]}"
