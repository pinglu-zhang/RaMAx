name: Release validation and publication

on:
  pull_request:
    branches: [dev, master]
  push:
    tags: ['v*.*.*']
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    name: Source build and four-format integration
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Check the source identity
        id: identity
        env:
          RELEASE_TAG: ${{ (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: python3 ci/check_release.py --tag "$RELEASE_TAG" --output evidence/source.json
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: ci/runtime.yml
          activate-environment: ramax-release-runtime
          channel-priority: flexible
      - name: Install the source toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12 cmake make pkg-config libboost-graph-dev libcurl4-openssl-dev libhdf5-dev libtbb-dev zlib1g-dev
      - name: Build the source and regression readers
        env:
          CC: /usr/bin/gcc-12
          CXX: /usr/bin/g++-12
        run: |
          hdf5_flags="$(pkg-config --cflags hdf5)"
          export CFLAGS="$hdf5_flags" CXXFLAGS="$hdf5_flags"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRAMAX_NATIVE_ARCH=OFF -DRAMAX_EMBED_TOOL_PATHS=OFF -DBUILD_TESTING=ON -DRAMAX_BUILD_TESTS=OFF -DRAMAX_HAL_JOBS=2 -DRAMAX_HAL_LIBS="$(pkg-config --libs hdf5) -lhdf5_cpp"
          cmake --build build --parallel 2
          ln -s ramax_release_hal_check build/halValidate
      - name: Run registered and installed-product checks
        run: |
          export PATH="$PWD/build:$PATH"
          ctest --test-dir build --output-on-failure --no-tests=error --timeout 600
          python ci/release_smoke.py --ramax "$PWD/build/ramax" --hal-validator "$PWD/build/ramax_release_hal_check" --output "$RUNNER_TEMP/source-smoke" --version '${{ steps.identity.outputs.version }}'
          cp "$RUNNER_TEMP/source-smoke/RESULT.json" evidence/source-smoke.json
          cp build/ramax_release_hal_check evidence/halValidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-evidence
          path: |
            evidence/
            build/Testing/Temporary/
            ${{ runner.temp }}/source-smoke/RESULT.json
            ${{ runner.temp }}/source-smoke/run.log
          if-no-files-found: error

  conda:
    name: Conda build and fresh installation
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: source-evidence
          path: source-evidence
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          channel-priority: flexible
      - name: Build from the checked-out source
        env:
          CPU_COUNT: '2'
          RAMAX_HAL_JOBS: '2'
          RAMAX_CONDA_SOURCE: path
        run: |
          conda install -y -n base -c conda-forge conda-build anaconda-client
          conda build recipe -c malab -c bioconda -c conda-forge --no-anaconda-upload --output-folder "$RUNNER_TEMP/conda-bld"
      - name: Fresh installation and four-format integration
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-cpp-103-1 libtbb12 libcurl4
          conda create -y -p "$RUNNER_TEMP/installed" --override-channels -c "file://$RUNNER_TEMP/conda-bld" -c malab -c bioconda -c conda-forge ramax=${{ needs.source.outputs.version }} python=3.11
          validator="$(find source-evidence -name halValidate -type f -print -quit)"
          test -n "$validator"
          chmod +x "$validator"
          conda run -p "$RUNNER_TEMP/installed" python ci/release_smoke.py --ramax "$RUNNER_TEMP/installed/bin/ramax" --hal-validator "$PWD/$validator" --output "$RUNNER_TEMP/conda-smoke" --version '${{ needs.source.outputs.version }}'
          cp "$RUNNER_TEMP/conda-smoke/RESULT.json" "$RUNNER_TEMP/conda-bld/conda-smoke.json"
          (cd "$RUNNER_TEMP/conda-bld" && sha256sum linux-64/ramax-*.conda > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conda-package
          path: |
            ${{ runner.temp }}/conda-bld/linux-64/ramax-*.conda
            ${{ runner.temp }}/conda-bld/conda-smoke.json
            ${{ runner.temp }}/conda-bld/SHA256SUMS
            ${{ runner.temp }}/conda-smoke/RESULT.json
            ${{ runner.temp }}/conda-smoke/run.log
          if-no-files-found: error

  docker:
    name: Docker build and unprivileged integration
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: source-evidence
          path: source-evidence
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ramax-ci:${{ needs.source.outputs.commit }}
          build-args: |
            RAMAX_VERSION=${{ needs.source.outputs.version }}
            VCS_REF=${{ needs.source.outputs.commit }}
            BUILD_JOBS=2
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate and retain this exact image
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libhdf5-cpp-103-1 libtbb12 libcurl4
          validator="$(find source-evidence -name halValidate -type f -print -quit)"
          test -n "$validator"
          chmod +x "$validator"
          python3 ci/release_smoke.py --docker-image 'ramax-ci:${{ needs.source.outputs.commit }}' --hal-validator "$PWD/$validator" --output "$RUNNER_TEMP/docker-smoke" --version '${{ needs.source.outputs.version }}'
          mkdir image
          cp "$RUNNER_TEMP/docker-smoke/RESULT.json" image/docker-smoke.json
          docker image inspect 'ramax-ci:${{ needs.source.outputs.commit }}' > image/image-inspect.json
          docker save 'ramax-ci:${{ needs.source.outputs.commit }}' | gzip > image/image.tar.gz
          (cd image && sha256sum image.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-image
          path: |
            image/
            ${{ runner.temp }}/docker-smoke/RESULT.json
            ${{ runner.temp }}/docker-smoke/run.log
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish verified artifacts and finalize the release
    needs: [source, conda, docker]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          channel-priority: flexible
      - name: Prepare publishing tools and require credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          test -n "$DOCKERHUB_TOKEN"
          test -n "$ANACONDA_API_TOKEN"
          conda install -y -n base -c conda-forge anaconda-client
          sudo apt-get update
          sudo apt-get install -y libhdf5-cpp-103-1 libtbb12 libcurl4
      - uses: docker/login-action@v3
        with:
          username: pingluzhang
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish and verify public installations
        env:
          GH_TOKEN: ${{ github.token }}
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python ci/publish_release.py --tag "$RELEASE_TAG" --artifacts artifacts --work "$RUNNER_TEMP/publication"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-record
          path: ${{ runner.temp }}/publication/
          if-no-files-found: warn
